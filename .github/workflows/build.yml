name: Build Kiwa APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fetch engine and assets from official APK
      run: |
        mkdir -p /tmp/apk
        curl -L -o /tmp/apk/collabora.apk \
          "https://www.collaboraoffice.com/downloads/Collabora-Office-Android-Release/collabora-office-mobile-26.04.3.1-155-release-arm64-v8a-2026-09-03.apk"

        mkdir -p lib/src/main/cpp/lib/arm64-v8a
        unzip -j -o /tmp/apk/collabora.apk "lib/arm64-v8a/*.so" -d lib/src/main/cpp/lib/arm64-v8a/

        rm -rf lib/src/main/assets
        mkdir -p /tmp/apk/extracted
        unzip -o -q /tmp/apk/collabora.apk "assets/*" -d /tmp/apk/extracted/
        mkdir -p lib/src/main/assets
        cp -r /tmp/apk/extracted/assets/. lib/src/main/assets/

        echo "=== Native libs ==="
        ls -lh lib/src/main/cpp/lib/arm64-v8a/
        echo "=== Assets size ==="
        du -sh lib/src/main/assets/

    - name: Build Debug APK
      id: build
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      continue-on-error: true

    - name: Locate APK and rename
      if: steps.build.outcome == 'success'
      id: locate
      run: |
        APK=$(find . -name "*.apk" -path "*debug*" | head -1)
        echo "Found: $APK"
        cp "$APK" "/tmp/Kiwa-v1.0.0.apk"
        echo "apk_path=/tmp/Kiwa-v1.0.0.apk" >> $GITHUB_OUTPUT

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn

    - name: Upload APK as artifact
      if: steps.build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: kiwa-debug-apk
        path: ${{ steps.locate.outputs.apk_path }}
        if-no-files-found: error

    - name: Publish to rolling release
      if: steps.build.outcome == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Kiwa — latest build"
        body: |
          Automatic build from commit ${{ github.sha }}
          Built: ${{ github.event.head_commit.timestamp }}
        files: ${{ steps.locate.outputs.apk_path }}
        prerelease: true
        make_latest: true

    - name: Fail if build failed
      if: steps.build.outcome != 'success'
      run: exit 1
