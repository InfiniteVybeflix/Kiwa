name: Build Kiwa APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Download engine (.so)
      run: |
        mkdir -p lib/src/main/cpp/lib/arm64-v8a
        curl -L -o lib/src/main/cpp/lib/arm64-v8a/liblo-native-code.so \
          https://github.com/InfiniteVybeflix/Kiwa/releases/download/engine-v26.04.3.1/liblo-native-code.so

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kiwa-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
