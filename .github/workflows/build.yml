name: Build Kiwa APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Show environment
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        ls -la $ANDROID_HOME 2>/dev/null || echo "no ANDROID_HOME"
        ls -la /usr/local/lib/android/sdk 2>/dev/null || echo "no default sdk"
        echo "--- JAVA ---"
        java -version
        echo "--- OS ---"
        cat /etc/os-release | head -3

    - name: Download engine (.so)
      run: |
        mkdir -p lib/src/main/cpp/lib/arm64-v8a
        curl -L -o lib/src/main/cpp/lib/arm64-v8a/liblo-native-code.so \
          https://github.com/InfiniteVybeflix/Kiwa/releases/download/engine-v26.04.3.1/liblo-native-code.so

    - name: Build Debug APK
      id: build
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      continue-on-error: true

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn

    - name: Upload APK
      if: steps.build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: kiwa-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Fail if build failed
      if: steps.build.outcome != 'success'
      run: |
        echo "Build failed. See build-log artifact."
        exit 1
