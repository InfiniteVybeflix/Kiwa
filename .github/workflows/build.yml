name: Build Kiwa APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fetch engine and assets from official APK
      run: |
        mkdir -p /tmp/apk
        curl -L -o /tmp/apk/collabora.apk \
          "https://www.collaboraoffice.com/downloads/Collabora-Office-Android-Release/collabora-office-mobile-26.04.3.1-155-release-arm64-v8a-2026-09-03.apk"

        # Native libraries
        mkdir -p lib/src/main/cpp/lib/arm64-v8a
        unzip -j -o /tmp/apk/collabora.apk "lib/arm64-v8a/*.so" -d lib/src/main/cpp/lib/arm64-v8a/

        # Assets
        rm -rf lib/src/main/assets
        mkdir -p /tmp/apk/extracted
        unzip -o -q /tmp/apk/collabora.apk "assets/*" -d /tmp/apk/extracted/
        mkdir -p lib/src/main/assets
        cp -r /tmp/apk/extracted/assets/. lib/src/main/assets/

        echo "=== Native libs ==="
        ls -lh lib/src/main/cpp/lib/arm64-v8a/
        echo "=== Assets size ==="
        du -sh lib/src/main/assets/

    - name: Build Debug APK
      id: build
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      continue-on-error: true

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn

    - name: Upload APK
      if: steps.build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: kiwa-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Fail if build failed
      if: steps.build.outcome != 'success'
      run: exit 1
